name: Deploy Frontend and Backend to ECS

on:
  workflow_dispatch:
    inputs:
      frontend_tag:
        description: "Frontend ECR image tag"
        required: true
        type: string

      backend_tag:
        description: "Backend ECR image tag"
        required: true
        type: string

env:
  AWS_REGION: ap-south-1
  AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}

  FRONTEND_ECR_REPOSITORY: student-frontend
  BACKEND_ECR_REPOSITORY: student-backend

  ECS_CLUSTER: fluffy-bat-3tibzr

  FRONTEND_ECS_SERVICE: student-frontend-task-service-3wkmar44
  BACKEND_ECS_SERVICE: student-backend-task-bk-service-yzzdiwgy

  FRONTEND_TASK_DEFINITION: student-frontend-task
  BACKEND_TASK_DEFINITION: student-backend-task


jobs:

  # --------------------------------------------------
  # 1. WAIT FOR MANUAL APPROVAL
  # --------------------------------------------------
  approval:
    name: Approve Production Deployment
    runs-on: ubuntu-latest

    environment:
      name: production

    steps:
      - name: Deployment approved
        run: |
          echo "Production deployment approved."
          echo "Frontend image: ${{ inputs.frontend_tag }}"
          echo "Backend image: ${{ inputs.backend_tag }}"


  # --------------------------------------------------
  # 2. DEPLOY FRONTEND
  # --------------------------------------------------
  deploy-frontend:
    name: Deploy Frontend
    needs: approval
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Validate frontend image
        run: |
          aws ecr describe-images \
            --repository-name "$FRONTEND_ECR_REPOSITORY" \
            --image-ids imageTag="${{ inputs.frontend_tag }}" \
            --region "$AWS_REGION"

      - name: Get current frontend task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition "$FRONTEND_TASK_DEFINITION" \
            --region "$AWS_REGION" \
            --query taskDefinition \
            --output json > frontend-task-definition.json

      - name: Update frontend image
        run: |
          IMAGE="$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$FRONTEND_ECR_REPOSITORY:${{ inputs.frontend_tag }}"

          jq \
            --arg IMAGE "$IMAGE" \
            '.containerDefinitions[0].image = $IMAGE |
             del(
               .taskDefinitionArn,
               .revision,
               .status,
               .requiresAttributes,
               .compatibilities,
               .registeredAt,
               .registeredBy
             )' \
            frontend-task-definition.json > frontend-new-task-definition.json

      - name: Register frontend task definition
        id: frontend-register
        run: |
          TASK_DEF_ARN=$(aws ecs register-task-definition \
            --cli-input-json file://frontend-new-task-definition.json \
            --region "$AWS_REGION" \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)

          echo "TASK_DEF_ARN=$TASK_DEF_ARN" >> "$GITHUB_ENV"

      - name: Deploy frontend to ECS
        run: |
          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$FRONTEND_ECS_SERVICE" \
            --task-definition "$TASK_DEF_ARN" \
            --region "$AWS_REGION"


  # --------------------------------------------------
  # 3. DEPLOY BACKEND
  # --------------------------------------------------
  deploy-backend:
    name: Deploy Backend
    needs: approval
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Validate backend image
        run: |
          aws ecr describe-images \
            --repository-name "$BACKEND_ECR_REPOSITORY" \
            --image-ids imageTag="${{ inputs.backend_tag }}" \
            --region "$AWS_REGION"

      - name: Get current backend task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition "$BACKEND_TASK_DEFINITION" \
            --region "$AWS_REGION" \
            --query taskDefinition \
            --output json > backend-task-definition.json

      - name: Update backend image
        run: |
          IMAGE="$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$BACKEND_ECR_REPOSITORY:${{ inputs.backend_tag }}"

          jq \
            --arg IMAGE "$IMAGE" \
            '.containerDefinitions[0].image = $IMAGE |
             del(
               .taskDefinitionArn,
               .revision,
               .status,
               .requiresAttributes,
               .compatibilities,
               .registeredAt,
               .registeredBy
             )' \
            backend-task-definition.json > backend-new-task-definition.json

      - name: Register backend task definition
        id: backend-register
        run: |
          TASK_DEF_ARN=$(aws ecs register-task-definition \
            --cli-input-json file://backend-new-task-definition.json \
            --region "$AWS_REGION" \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)

          echo "TASK_DEF_ARN=$TASK_DEF_ARN" >> "$GITHUB_ENV"

      - name: Deploy backend to ECS
        run: |
          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$BACKEND_ECS_SERVICE" \
            --task-definition "$TASK_DEF_ARN" \
            --region "$AWS_REGION"
