name: Dev Stage Production

on:
  workflow_dispatch:

env:
  AWS_REGION: ap-south-1
  ECS_CLUSTER: fluffy-bat-3tibzr

  FRONTEND_ECS_SERVICE: student-frontend-task-service-3wkmar44
  BACKEND_ECS_SERVICE: student-backend-task-bk-service-yzzdiwgy


jobs:

  # ============================================================
  # DEVELOPMENT
  # ============================================================
  development:
    name: Deploy to Development
    runs-on: ubuntu-latest

    environment:
      name: development

    steps:

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Check AWS connection
        run: |
          aws sts get-caller-identity

      - name: Deploy Frontend
        run: |
          echo "Starting frontend deployment..."

          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$FRONTEND_ECS_SERVICE" \
            --force-new-deployment \
            --region "$AWS_REGION"

          echo "Frontend deployment started."

      - name: Deploy Backend
        run: |
          echo "Starting backend deployment..."

          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$BACKEND_ECS_SERVICE" \
            --force-new-deployment \
            --region "$AWS_REGION"

          echo "Backend deployment started."

      - name: Development deployment completed
        run: |
          echo "Development deployment completed."


  # ============================================================
  # STAGING
  # ============================================================
  staging:
    name: Deploy to Staging
    needs: development
    runs-on: ubuntu-latest

    environment:
      name: staging

    steps:

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Check AWS connection
        run: |
          aws sts get-caller-identity

      - name: Deploy Frontend
        run: |
          echo "Starting frontend staging deployment..."

          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$FRONTEND_ECS_SERVICE" \
            --force-new-deployment \
            --region "$AWS_REGION"

          echo "Frontend staging deployment started."

      - name: Deploy Backend
        run: |
          echo "Starting backend staging deployment..."

          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$BACKEND_ECS_SERVICE" \
            --force-new-deployment \
            --region "$AWS_REGION"

          echo "Backend staging deployment started."

      - name: Staging deployment completed
        run: |
          echo "Staging deployment completed."


  # ============================================================
  # PRODUCTION
  # ============================================================
  production:
    name: Deploy to Production
    needs: staging
    runs-on: ubuntu-latest

    environment:
      name: production

    steps:

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Check AWS connection
        run: |
          aws sts get-caller-identity

      - name: Deploy Frontend
        run: |
          echo "Starting frontend production deployment..."

          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$FRONTEND_ECS_SERVICE" \
            --force-new-deployment \
            --region "$AWS_REGION"

          echo "Frontend production deployment started."

      - name: Deploy Backend
        run: |
          echo "Starting backend production deployment..."

          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$BACKEND_ECS_SERVICE" \
            --force-new-deployment \
            --region "$AWS_REGION"

          echo "Backend production deployment started."

      - name: Production deployment completed
        run: |
          echo "Production deployment completed."
